{% extends "base.html" %}

{%block the_body %}
	<h2>{{ the_title }}</h2>

	<p>Login with your Last.fm credentials:</p>

	<form action="/login" method="POST">
		Username: <input type="text" name="username"><br>
		Password: <input type="password" name="password"><br>
		<input type="submit" value="Login">
	</form>

	<p>Don't have credentials set up? <a href="/setup">Set them up first</a></p>

{% endblock %}
